name: Tạo video Premium StickTalk

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Ý tưởng video"
        required: true
        type: string
      duration:
        description: "Thời lượng"
        required: true
        default: "45"
        type: choice
        options: ["30", "45", "60"]
      content_format:
        description: "Định dạng nội dung"
        required: true
        default: hybrid
        type: choice
        options: [narration, dialogue, hybrid]
      script_mode:
        description: "Chế độ viết kịch bản"
        required: true
        default: "Tự động theo chủ đề"
        type: choice
        options:
          - "Tự động theo chủ đề"
          - "Một người dẫn chuyện"
          - "Hai nhân vật đối thoại"
          - "Kể chuyện"
          - "Danh sách"
          - "Phân tích"
      writing_style:
        description: "Phong cách viết nội dung"
        required: true
        default: "Tự động theo chủ đề"
        type: choice
        options:
          - "Tự động theo chủ đề"
          - "Ngắn gọn TikTok"
          - "Kể chuyện cảm xúc"
          - "Thực tế kinh doanh"
          - "Giải thích dễ hiểu"
          - "Đối thoại tự nhiên"
          - "Tin tức rõ ràng"
      tone:
        description: "Giọng điệu"
        required: true
        default: "sâu_sắc"
        type: choice
        options: ["sâu_sắc", "hài_hước", "truyền_động_lực", "chữa_lành"]
      style:
        description: "Phong cách hình ảnh"
        required: true
        default: người_que_triết_lý
        type: choice
        options: [người_que_triết_lý, người_que_tiktok, người_que_doanh_nhân, người_que_kể_chuyện, tin_tức_ai]
      motion_level:
        description: "Mức chuyển động"
        required: true
        default: trung_bình
        type: choice
        options:
          - nhẹ
          - trung_bình
          - nhiều
          - viral_tiktok
      voice:
        description: "Giọng đọc"
        required: true
        default: "Nam miền Bắc Nội lực Plus"
        type: choice
        options:
          - "Nam miền Bắc MC"
          - "Nam miền Bắc Nội lực"
          - "Nam miền Bắc Nội lực Plus"
          - "Nam miền Bắc Podcast"
          - "Nam miền Bắc Truyền cảm"
          - "Nam miền Bắc Doanh nhân"
          - "Nữ miền Bắc Dịu nhẹ"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài FFmpeg và Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser || sudo apt-get install -y ffmpeg chromium

      - name: Cài Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Cài Remotion
        working-directory: remotion
        run: npm install

      - name: Hiển thị cấu hình
        run: |
          echo "Ý tưởng: ${{ inputs.idea }}"
          echo "Thời lượng: ${{ inputs.duration }} giây"
          echo "Giọng điệu: ${{ inputs.tone }}"
          echo "Định dạng: ${{ inputs.content_format }}"
          echo "Chế độ viết kịch bản: ${{ inputs.script_mode }}"
          echo "Phong cách viết nội dung: ${{ inputs.writing_style }}"
          echo "Phong cách: ${{ inputs.style }}"
          echo "Mức chuyển động: ${{ inputs.motion_level }}"
          echo "Giọng đọc: ${{ inputs.voice }}"

      - name: Tạo video
        env:
          VIDEO_IDEA: ${{ inputs.idea }}
          VIDEO_DURATION: ${{ inputs.duration }}
          VIDEO_TONE: ${{ inputs.tone }}
          VIDEO_CONTENT_FORMAT: ${{ inputs.content_format }}
          VIDEO_SCRIPT_MODE: ${{ inputs.script_mode }}
          VIDEO_WRITING_STYLE: ${{ inputs.writing_style }}
          VIDEO_STYLE: ${{ inputs.style }}
          VIDEO_MOTION_LEVEL: ${{ inputs.motion_level }}
          VIDEO_VOICE: ${{ inputs.voice }}
        run: |
          chmod +x make_video.sh
          ./make_video.sh

      - name: Kiểm tra video
        run: test -s output/video.mp4 && test -s output/preview.png

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sticktalk-video
          path: |
            output/video.mp4
            output/preview.png
            output/script.txt
            output/story.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

name: Tạo video Premium StickTalk

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Chủ đề video"
        required: true
        type: string
      duration:
        description: "Thời lượng video"
        required: true
        default: "45 giây"
        type: choice
        options:
          - "30 giây"
          - "45 giây"
          - "60 giây"
      tone:
        description: "Giọng điệu nội dung"
        required: true
        default: "Sâu sắc"
        type: choice
        options:
          - "Sâu sắc"
          - "Hài hước"
          - "Trung tính"
      vieneu_voice:
        description: "Giọng đọc VieNeu-TTS Premium"
        required: true
        default: "Trúc Ly"
        type: choice
        options:
          - "Trúc Ly"
          - "Minh Đức"
          - "Phạm Tuyền"
          - "Thái Sơn"
          - "Xuân Vĩnh"
          - "Thanh Bình"
          - "Ngọc Linh"
          - "Đoan Trang"
          - "Mai Anh"
          - "Hoàng Mỹ Đoan"
          - "Minh Triết"
          - "Thùy Dung"
          - "Quang Sơn"
          - "Ngọc Trần"
          - "Nhập mã giọng khác"
      custom_voice_id:
        description: "Tên hoặc mã giọng VieNeu khác (chỉ điền khi chọn Nhập mã giọng khác)"
        required: false
        default: ""
        type: string
      voice_emotion:
        description: "Phong cách đọc VieNeu"
        required: true
        default: "Kể chuyện"
        type: choice
        options:
          - "Tự nhiên"
          - "Kể chuyện"
          - "Tin tức"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lưu bộ nhớ đệm mô hình VieNeu v3 Turbo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/vieneu
            ~/.cache/onnxruntime
          key: vieneu-v3-onnx-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            vieneu-v3-onnx-${{ runner.os }}-py311-

      - name: Cài FFmpeg, Chromium và eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng chromium-browser || sudo apt-get install -y ffmpeg espeak-ng chromium

      - name: Cài thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from vieneu import Vieneu; import onnxruntime; print('VieNeu v3 Turbo ONNX đã sẵn sàng')"

      - name: Cài Remotion
        working-directory: remotion
        run: npm install

      - name: Hiển thị cấu hình
        run: |
          echo "Mẫu video: Vox giấy cắt"
          echo "Chủ đề: ${{ inputs.idea }}"
          echo "Thời lượng: ${{ inputs.duration }}"
          echo "Giọng điệu: ${{ inputs.tone }}"
          echo "Giọng VieNeu: ${{ inputs.vieneu_voice }}"
          echo "Phong cách đọc: ${{ inputs.voice_emotion }}"
          echo "Pipeline: phim tài liệu tổng quát, không dùng nội dung động lực/doanh nhân"
          echo "Asset: nguồn miễn phí có giấy phép rõ ràng"

      - name: Tạo video
        env:
          VIDEO_PROJECT: motivation
          VIDEO_TEMPLATE: vox-paper-collage
          VIDEO_IDEA: ${{ inputs.idea }}
          VIDEO_DURATION: ${{ inputs.duration == '30 giây' && '30' || inputs.duration == '60 giây' && '60' || '45' }}
          VIDEO_TONE: ${{ inputs.tone == 'Hài hước' && 'hài_hước' || inputs.tone == 'Trung tính' && 'trung_tính' || 'sâu_sắc' }}
          VIDEO_CONTENT_FORMAT: narration
          VIDEO_SCRIPT_MODE: Phim tài liệu
          VIDEO_WRITING_STYLE: Bám sát chủ đề, mỗi cảnh một dữ kiện mới
          VIENEU_VOICE: ${{ inputs.vieneu_voice }}
          VIENEU_CUSTOM_VOICE_ID: ${{ inputs.custom_voice_id }}
          VIENEU_EMOTION: ${{ inputs.voice_emotion }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          chmod +x make_video.sh
          ./make_video.sh

      - name: Kiểm tra video và asset
        run: |
          test -s output/video.mp4
          test -s output/preview.png
          test -s output/tts-info.json
          test -s output/asset-manifest.json
          test -s output/credits.txt
          test "$(find assets/generated-assets -type f | wc -l)" -gt 0

      - name: Tải video thành phẩm lên
        uses: actions/upload-artifact@v4
        with:
          name: video-sticktalk
          path: |
            output/video.mp4
            output/preview.png
            output/script.txt
            output/story.json
            output/tts-info.json
            output/asset-manifest.json
            output/credits.txt
            assets/generated-assets/
            assets/narration.wav
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

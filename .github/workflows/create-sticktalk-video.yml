name: Tạo video Premium StickTalk

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project video"
        required: true
        default: "Động lực"
        type: choice
        options:
          - "Động lực"
      template:
        description: "Mẫu video Động lực (nguồn Remotion mã nguồn mở)"
        required: true
        default: "Prompt to Video"
        type: choice
        options:
          - "Prompt to Video"
          - "Kinetic Captions"
          - "Smooth Transitions"
          - "Paper Sketch"
          - "Business Motivation"
      idea:
        description: "Ý tưởng video"
        required: true
        type: string
      duration:
        description: "Thời lượng"
        required: true
        default: "45"
        type: choice
        options: ["30", "45", "60"]
      content_format:
        description: "Định dạng nội dung"
        required: true
        default: hybrid
        type: choice
        options: [narration, dialogue, hybrid]
      tone:
        description: "Giọng điệu"
        required: true
        default: "truyền_động_lực"
        type: choice
        options: ["sâu_sắc", "hài_hước", "truyền_động_lực", "chữa_lành"]
      vieneu_voice:
        description: "Giọng VieNeu-TTS Premium"
        required: true
        default: "Trúc Ly"
        type: choice
        options:
          - "Trúc Ly"
          - "Minh Đức"
          - "Phạm Tuyền"
          - "Thái Sơn"
          - "Xuân Vĩnh"
          - "Thanh Bình"
          - "Ngọc Linh"
          - "Đoan Trang"
          - "Mai Anh"
          - "Hoàng Mỹ Đoan"
          - "Minh Triết"
          - "Thùy Dung"
          - "Quang Sơn"
          - "Ngọc Trần"
          - "Nhập mã giọng khác"
      custom_voice_id:
        description: "Tên hoặc mã giọng VieNeu khác (chỉ điền khi chọn Nhập mã giọng khác)"
        required: false
        default: ""
        type: string
      voice_emotion:
        description: "Phong cách đọc VieNeu"
        required: true
        default: "Tự nhiên"
        type: choice
        options:
          - "Tự nhiên"
          - "Kể chuyện"
          - "Tin tức"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache model VieNeu v3 Turbo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/vieneu
            ~/.cache/onnxruntime
          key: vieneu-v3-onnx-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            vieneu-v3-onnx-${{ runner.os }}-py311-

      - name: Cài FFmpeg, Chromium và eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng chromium-browser || sudo apt-get install -y ffmpeg espeak-ng chromium

      - name: Cài Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from vieneu import Vieneu; import onnxruntime; print('VieNeu v3 Turbo ONNX đã sẵn sàng')"

      - name: Cài Remotion
        working-directory: remotion
        run: npm install

      - name: Hiển thị cấu hình
        run: |
          echo "Project: ${{ inputs.project }}"
          echo "Mẫu video: ${{ inputs.template }}"
          echo "Ý tưởng: ${{ inputs.idea }}"
          echo "Thời lượng: ${{ inputs.duration }} giây"
          echo "Giọng VieNeu: ${{ inputs.vieneu_voice }}"
          echo "Phong cách đọc: ${{ inputs.voice_emotion }}"

      - name: Tạo video
        env:
          VIDEO_PROJECT: motivation
          VIDEO_TEMPLATE: ${{ inputs.template == 'Prompt to Video' && 'prompt-to-video' || inputs.template == 'Kinetic Captions' && 'kinetic-captions' || inputs.template == 'Smooth Transitions' && 'smooth-transitions' || inputs.template == 'Paper Sketch' && 'paper-sketch' || 'business-motivation' }}
          VIDEO_IDEA: ${{ inputs.idea }}
          VIDEO_DURATION: ${{ inputs.duration }}
          VIDEO_TONE: ${{ inputs.tone }}
          VIDEO_CONTENT_FORMAT: ${{ inputs.content_format }}
          VIENEU_VOICE: ${{ inputs.vieneu_voice }}
          VIENEU_CUSTOM_VOICE_ID: ${{ inputs.custom_voice_id }}
          VIENEU_EMOTION: ${{ inputs.voice_emotion }}
        run: |
          chmod +x make_video.sh
          ./make_video.sh

      - name: Kiểm tra video
        run: test -s output/video.mp4 && test -s output/preview.png && test -s output/tts-info.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sticktalk-video
          path: |
            output/video.mp4
            output/preview.png
            output/script.txt
            output/story.json
            output/tts-info.json
            assets/narration.wav
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

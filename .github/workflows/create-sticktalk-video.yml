name: Tạo video Premium StickTalk

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Chủ đề video"
        required: true
        type: string
      duration:
        description: "Thời lượng video"
        required: true
        default: "45 giây"
        type: choice
        options:
          - "30 giây"
          - "45 giây"
          - "60 giây"
          - "90 giây"
      aspect_ratio:
        description: "Tỷ lệ khung hình"
        required: true
        default: "9:16 dọc"
        type: choice
        options:
          - "9:16 dọc"
          - "16:9 ngang"
      vieneu_voice:
        description: "Giọng đọc VieNeu-TTS Premium"
        required: true
        default: "Trúc Ly"
        type: choice
        options:
          - "Trúc Ly"
          - "Minh Đức"
          - "Phạm Tuyền"
          - "Thái Sơn"
          - "Xuân Vĩnh"
          - "Thanh Bình"
          - "Ngọc Linh"
          - "Đoan Trang"
          - "Mai Anh"
          - "Hoàng Mỹ Đoan"
          - "Minh Triết"
          - "Thùy Dung"
          - "Quang Sơn"
          - "Ngọc Trần"
          - "Nhập mã giọng khác"
      custom_voice_id:
        description: "Tên hoặc mã giọng VieNeu khác (chỉ điền khi chọn Nhập mã giọng khác)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lưu bộ nhớ đệm mô hình VieNeu v3 Turbo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/vieneu
            ~/.cache/onnxruntime
          key: vieneu-v3-onnx-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            vieneu-v3-onnx-${{ runner.os }}-py311-

      - name: Cài FFmpeg, Chromium và eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng chromium-browser || sudo apt-get install -y ffmpeg espeak-ng chromium

      - name: Cài thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from vieneu import Vieneu; import onnxruntime; print('VieNeu v3 Turbo ONNX đã sẵn sàng')"

      - name: Cài Remotion
        working-directory: remotion
        run: npm install

      - name: Hiển thị cấu hình
        run: |
          echo "Engine: Vox Paper Collage"
          echo "Chủ đề: ${{ inputs.idea }}"
          echo "Thời lượng: ${{ inputs.duration }}"
          echo "Khung hình: ${{ inputs.aspect_ratio }}"
          echo "Giọng VieNeu: ${{ inputs.vieneu_voice }}"
          echo "AI: Gemini — chỉ nghiên cứu + viết kịch bản text"
          echo "Ảnh: Pexels / Pixabay / Unsplash / Openverse"
          echo "Icon: Lucide open-source"
          echo "Quy trình: Gemini text → ảnh web → VieNeu → Remotion"

      - name: Tạo video
        env:
          VIDEO_IDEA: ${{ inputs.idea }}
          VIDEO_DURATION: ${{ inputs.duration == '30 giây' && '30' || inputs.duration == '60 giây' && '60' || inputs.duration == '90 giây' && '90' || '45' }}
          VIDEO_ASPECT_RATIO: ${{ inputs.aspect_ratio == '16:9 ngang' && '16:9' || '9:16' }}
          VIENEU_VOICE: ${{ inputs.vieneu_voice }}
          VIENEU_CUSTOM_VOICE_ID: ${{ inputs.custom_voice_id }}
          AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Thiếu GEMINI_API_KEY trong GitHub Secrets."
            exit 1
          fi
          chmod +x make_video.sh
          ./make_video.sh

      - name: Kiểm tra nghiên cứu, video và asset
        run: |
          test -s output/research.json
          test -s output/story.json
          test -s output/script.txt
          test -s output/video.mp4
          test -s output/preview.png
          test -s output/tts-info.json
          test -s output/asset-manifest.json
          test -s output/credits.txt
          test "$(find assets/generated-assets -type f | wc -l)" -gt 0

      - name: Tải video MP4 thành phẩm lên
        uses: actions/upload-artifact@v4
        with:
          name: video-sticktalk-mp4
          path: output/video.mp4
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

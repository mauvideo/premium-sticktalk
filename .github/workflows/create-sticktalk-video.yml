name: Tạo video Premium StickTalk

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Ý tưởng video"
        required: true
        type: string
      duration:
        description: "Thời lượng"
        required: true
        default: "45"
        type: choice
        options: ["30", "45", "60"]
      content_format:
        description: "Định dạng nội dung"
        required: true
        default: hybrid
        type: choice
        options: [narration, dialogue, hybrid]
      script_mode:
        description: "Chế độ viết kịch bản"
        required: true
        default: "Tự động theo chủ đề"
        type: choice
        options:
          - "Tự động theo chủ đề"
          - "Một người dẫn chuyện"
          - "Hai nhân vật đối thoại"
          - "Kể chuyện"
          - "Danh sách"
          - "Phân tích"
      writing_style:
        description: "Phong cách viết nội dung"
        required: true
        default: "Tự động theo chủ đề"
        type: choice
        options:
          - "Tự động theo chủ đề"
          - "Ngắn gọn TikTok"
          - "Kể chuyện cảm xúc"
          - "Thực tế kinh doanh"
          - "Giải thích dễ hiểu"
          - "Đối thoại tự nhiên"
          - "Tin tức rõ ràng"
      tone:
        description: "Giọng điệu"
        required: true
        default: "sâu_sắc"
        type: choice
        options: ["sâu_sắc", "hài_hước", "truyền_động_lực", "chữa_lành"]
      style:
        description: "Phong cách hình ảnh"
        required: true
        default: người_que_triết_lý
        type: choice
        options:
          - người_que_triết_lý
          - người_que_tiktok
          - người_que_doanh_nhân
          - người_que_kể_chuyện
          - tin_tức_ai
          - "Phác thảo điện ảnh — Trầm"
          - "Phác thảo điện ảnh — Sách kỹ năng"
          - "Phác thảo điện ảnh — Doanh nhân"
      motion_level:
        description: "Mức chuyển động"
        required: true
        default: trung_bình
        type: choice
        options:
          - nhẹ
          - trung_bình
          - nhiều
          - viral_tiktok
      vieneu_voice:
        description: "Giọng VieNeu-TTS Premium"
        required: true
        default: "Mặc định — Trúc Ly"
        type: choice
        options:
          - "Mặc định — Trúc Ly"
          - "Bác sĩ Tuyên"
          - "Nhập mã giọng khác"
      custom_voice_id:
        description: "Mã giọng VieNeu khác (chỉ điền khi chọn Nhập mã giọng khác)"
        required: false
        default: ""
        type: string
      voice_emotion:
        description: "Cảm xúc giọng"
        required: true
        default: "Tự nhiên"
        type: choice
        options:
          - "Tự nhiên"
          - "Kể chuyện"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache model VieNeu và Hugging Face
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/vieneu
            ~/.cache/torch
          key: vieneu-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            vieneu-${{ runner.os }}-py311-

      - name: Cài FFmpeg, Chromium và eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng chromium-browser || sudo apt-get install -y ffmpeg espeak-ng chromium

      - name: Cài Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Cài Remotion
        working-directory: remotion
        run: npm install

      - name: Hiển thị cấu hình
        run: |
          echo "Ý tưởng: ${{ inputs.idea }}"
          echo "Thời lượng: ${{ inputs.duration }} giây"
          echo "Phong cách: ${{ inputs.style }}"
          echo "Giọng VieNeu: ${{ inputs.vieneu_voice }}"
          echo "Mã giọng tùy chỉnh: ${{ inputs.custom_voice_id }}"
          echo "Cảm xúc giọng: ${{ inputs.voice_emotion }}"
          echo "Hệ thống giọng đọc: VieNeu-TTS Premium"

      - name: Tạo video
        env:
          VIDEO_IDEA: ${{ inputs.idea }}
          VIDEO_DURATION: ${{ inputs.duration }}
          VIDEO_TONE: ${{ inputs.tone }}
          VIDEO_CONTENT_FORMAT: ${{ inputs.content_format }}
          VIDEO_SCRIPT_MODE: ${{ inputs.script_mode }}
          VIDEO_WRITING_STYLE: ${{ inputs.writing_style }}
          VIDEO_STYLE: ${{ inputs.style }}
          VIDEO_MOTION_LEVEL: ${{ inputs.motion_level }}
          VIENEU_VOICE: ${{ inputs.vieneu_voice }}
          VIENEU_CUSTOM_VOICE_ID: ${{ inputs.custom_voice_id }}
          VIENEU_EMOTION: ${{ inputs.voice_emotion }}
        run: |
          chmod +x make_video.sh
          ./make_video.sh

      - name: Kiểm tra video
        run: test -s output/video.mp4 && test -s output/preview.png && test -s output/tts-info.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sticktalk-video
          path: |
            output/video.mp4
            output/preview.png
            output/script.txt
            output/story.json
            output/tts-info.json
            assets/narration.wav
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

name: Tạo video Premium StickTalk

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Ý tưởng video"
        required: true
        type: string
      duration:
        description: "Thời lượng"
        required: true
        default: "45"
        type: choice
        options: ["30", "45", "60"]
      content_format:
        description: "Định dạng nội dung"
        required: true
        default: hybrid
        type: choice
        options: [narration, dialogue, hybrid]
      script_mode:
        description: "Chế độ viết kịch bản"
        required: true
        default: "Tự động theo chủ đề"
        type: choice
        options:
          - "Tự động theo chủ đề"
          - "Một người dẫn chuyện"
          - "Hai nhân vật đối thoại"
          - "Kể chuyện"
          - "Danh sách"
          - "Phân tích"
      writing_style:
        description: "Phong cách viết nội dung"
        required: true
        default: "Tự động theo chủ đề"
        type: choice
        options:
          - "Tự động theo chủ đề"
          - "Ngắn gọn TikTok"
          - "Kể chuyện cảm xúc"
          - "Thực tế kinh doanh"
          - "Giải thích dễ hiểu"
          - "Đối thoại tự nhiên"
          - "Tin tức rõ ràng"
      tone:
        description: "Giọng điệu"
        required: true
        default: "sâu_sắc"
        type: choice
        options: ["sâu_sắc", "hài_hước", "truyền_động_lực", "chữa_lành"]
      style:
        description: "Phong cách hình ảnh"
        required: true
        default: người_que_triết_lý
        type: choice
        options:
          - người_que_triết_lý
          - người_que_tiktok
          - người_que_doanh_nhân
          - người_que_kể_chuyện
          - tin_tức_ai
          - "Phác thảo điện ảnh — Trầm"
          - "Phác thảo điện ảnh — Sách kỹ năng"
          - "Phác thảo điện ảnh — Doanh nhân"
      motion_level:
        description: "Mức chuyển động"
        required: true
        default: trung_bình
        type: choice
        options:
          - nhẹ
          - trung_bình
          - nhiều
          - viral_tiktok
      voice:
        description: "Giọng đọc"
        required: true
        default: "Nam tiếng Việt — Tự nhiên"
        type: choice
        options:
          - "Nam tiếng Việt — Tự nhiên"
          - "Nam tiếng Việt — Nội lực"
          - "Nam tiếng Việt — Phát thanh"
          - "Nam tiếng Việt — Kể chuyện"
          - "Nữ tiếng Việt — Tự nhiên"
          - "Google Nam tiếng Việt — Trầm"
          - "Google Nam tiếng Việt — Phát thanh"
          - "Google Nam tiếng Việt — Nội lực"
          - "Google Nam Neural 2"
          - "Google Nam WaveNet"
          - "Google Nam Standard"
          - "Google Nữ Neural 2"
          - "Google Nữ WaveNet"
      tts_provider:
        description: "Nhà cung cấp giọng đọc"
        required: true
        default: "Microsoft Edge miễn phí"
        type: choice
        options:
          - "Microsoft Edge miễn phí"
          - "Google Cloud (nâng cao)"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài FFmpeg và Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser || sudo apt-get install -y ffmpeg chromium

      - name: Cài Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Cài Remotion
        working-directory: remotion
        run: npm install

      - name: Hiển thị cấu hình
        run: |
          echo "Ý tưởng: ${{ inputs.idea }}"
          echo "Thời lượng: ${{ inputs.duration }} giây"
          echo "Giọng điệu: ${{ inputs.tone }}"
          echo "Định dạng: ${{ inputs.content_format }}"
          echo "Chế độ viết kịch bản: ${{ inputs.script_mode }}"
          echo "Phong cách viết nội dung: ${{ inputs.writing_style }}"
          echo "Phong cách: ${{ inputs.style }}"
          echo "Mức chuyển động: ${{ inputs.motion_level }}"
          echo "Giọng đọc: ${{ inputs.voice }}"
          echo "Nhà cung cấp giọng đọc: ${{ inputs.tts_provider }}"

      - name: Cấu hình Google Cloud Text-to-Speech
        if: inputs.tts_provider == 'Google Cloud (nâng cao)'
        env:
          GOOGLE_CLOUD_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GOOGLE_CLOUD_CREDENTIALS_JSON" ]; then
            echo "Chưa cấu hình Google Cloud Text-to-Speech. Hãy thêm GitHub Secret GOOGLE_CLOUD_CREDENTIALS_JSON." >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_CLOUD_CREDENTIALS_JSON" > "$RUNNER_TEMP/google-cloud-credentials.json"
          chmod 600 "$RUNNER_TEMP/google-cloud-credentials.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/google-cloud-credentials.json" >> "$GITHUB_ENV"

      - name: Tạo video
        env:
          VIDEO_IDEA: ${{ inputs.idea }}
          VIDEO_DURATION: ${{ inputs.duration }}
          VIDEO_TONE: ${{ inputs.tone }}
          VIDEO_CONTENT_FORMAT: ${{ inputs.content_format }}
          VIDEO_SCRIPT_MODE: ${{ inputs.script_mode }}
          VIDEO_WRITING_STYLE: ${{ inputs.writing_style }}
          VIDEO_STYLE: ${{ inputs.style }}
          VIDEO_MOTION_LEVEL: ${{ inputs.motion_level }}
          VIDEO_VOICE: ${{ inputs.voice }}
          TTS_PROVIDER: ${{ inputs.tts_provider == 'Google Cloud (nâng cao)' && 'google' || 'edge' }}
          GOOGLE_TTS_VOICE: ${{ inputs.voice }}
        run: |
          chmod +x make_video.sh
          ./make_video.sh

      - name: Kiểm tra video
        run: test -s output/video.mp4 && test -s output/preview.png

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sticktalk-video
          path: |
            output/video.mp4
            output/preview.png
            output/script.txt
            output/story.json
            output/tts-info.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Xóa file thông tin xác thực tạm
        if: always()
        run: rm -f "$RUNNER_TEMP/google-cloud-credentials.json"
